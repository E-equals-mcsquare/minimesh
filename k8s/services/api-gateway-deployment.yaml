apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
    tier: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 9999
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: "api-gateway"
            - name: USER_SERVICE_URL
              value: "http://user-service:8001"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:8002"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:8003"
          livenessProbe:
            httpGet:
              path: /_status
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /_status
              port: http
            initialDelaySeconds: 1
            periodSeconds: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
